name: Refresh descriptive soccer statistics
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/soccer-context.yml
      - scripts/soccer-context.mjs
      - lib/soccer.js
      - lib/matchup-form.js
      - src/soccer-data.js
  schedule:
    - cron: '37 12 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tonati-publication
  cancel-in-progress: false
jobs:
  statistics:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/soccer-context.mjs
      - run: npm test && npm run build
      - name: Preserve prediction history
        run: node scripts/ledger.mjs check HEAD
      - name: Save descriptive snapshot
        run: |
          git config user.name 'TONATI LAB Research'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/soccer-context.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh dated descriptive soccer statistics'
            git push origin HEAD:main
          fi
