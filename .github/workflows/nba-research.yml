name: Publish and grade daily NBA analysis
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/nba-research.yml
      - scripts/nba-daily.mjs
      - scripts/nba-research.mjs
      - lib/nba-publication.js
      - lib/nba.js
      - lib/matchup-form.js
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tonati-publication
  cancel-in-progress: false
jobs:
  research:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/nba-daily.mjs
      - run: npm test && npm run build
      - name: Check preserved history
        run: node scripts/ledger.mjs check HEAD
      - name: Save research snapshot
        run: |
          git config user.name 'TONATI LAB Research'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/nba-research.json data/daily-feed.json data/ledger.jsonl
          if ! git diff --cached --quiet; then
            git commit -m 'Run daily experimental NBA publication and grading'
            git push origin HEAD:main
          fi
