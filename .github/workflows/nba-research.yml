name: Refresh NBA research
on:
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tonati-publication
  cancel-in-progress: false
jobs:
  research:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/nba-research.mjs
      - run: npm test && npm run build
      - name: Save research snapshot
        run: |
          git config user.name 'TONATI LAB Research'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/nba-research.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh real-data NBA research snapshot'
            git push origin HEAD:main
          fi
