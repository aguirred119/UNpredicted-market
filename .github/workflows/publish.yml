name: Publish TONATI LAB record
on:
  workflow_dispatch:
    inputs:
      record:
        description: 'Editorial/model forecast JSON, or resolution JSON. No private data or API keys.'
        required: true
        type: string
      action:
        description: 'Publish a new forecast or append a result/correction'
        type: choice
        options: [publish, resolve]
        default: publish
permissions:
  contents: write
concurrency:
  group: tonati-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Append reviewed record
        env:
          RECORD: ${{ inputs.record }}
          RECORD_ACTION: ${{ inputs.action }}
        run: |
          node -e "require('fs').writeFileSync('/tmp/tonati-record.json', process.env.RECORD)"
          node scripts/ledger.mjs "$RECORD_ACTION" /tmp/tonati-record.json
          npm test
          npm run build
      - name: Commit preserved history
        run: |
          git config user.name 'TONATI LAB Publisher'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ledger.jsonl
          git commit -m 'Publish timestamped TONATI LAB record'
          git push origin HEAD:main
