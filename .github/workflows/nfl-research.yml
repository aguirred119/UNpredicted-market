name: Publish and grade daily NFL analysis
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/nfl-research.yml
      - scripts/nfl-daily.mjs
      - scripts/nfl-research.mjs
      - lib/nfl.js
      - lib/nba-publication.js
      - lib/matchup-form.js
      - src/us-stats.js
  schedule:
    - cron: '27 12 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tonati-publication
  cancel-in-progress: false
jobs:
  research:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/nfl-daily.mjs
        env:
          DAILY_CADENCE: 'Daily, approximately 05:27 Pacific daylight time / 04:27 Pacific standard time. Scheduled jobs can be delayed.'
      - run: npm test && npm run build
      - name: Check preserved history
        run: node scripts/ledger.mjs check HEAD
      - name: Save research snapshot
        run: |
          git config user.name 'TONATI LAB Research'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/nfl-research.json data/nfl-feed.json data/ledger.jsonl
          if ! git diff --cached --quiet; then
            git commit -m 'Run daily experimental NFL publication and grading'
            git push origin HEAD:main
          fi
